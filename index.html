<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PDF Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/web/pdf_viewer.css">
<style>
  html, body { margin: 0; height: 100%; background: #525659; font-family: system-ui, sans-serif; overflow: hidden; }
  #bar { position: absolute; top: 0; left: 0; right: 0; height: 48px; display: none; align-items: center;
         justify-content: safe center; gap: 6px; overflow-x: auto; white-space: nowrap; background: #323639; color: #fff; padding: 0 8px; z-index: 5; }
  button { min-width: 44px; height: 40px; border: 0; border-radius: 6px; background: #4a4e52; color: #fff;
           font-size: 18px; cursor: pointer; }
  button:hover { background: #5c6166; }
  #bar label { font-size: 14px; }
  #zl { min-width: 52px; text-align: center; font-size: 14px; }
  #picker { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #picker button { padding: 0 24px; font-size: 16px; height: 48px; }
  /* pdf.js needs an absolutely positioned container; touch-action lets our pinch handler run */
  #c { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; overflow: auto; display: none;
       touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; }
  .spacer { flex: 1; }
</style>

<body>
  <div id="bar">
    <button id="open" title="Open another PDF">Open</button>
    <button id="out" title="Zoom out (Ctrl -)">&minus;</button>
    <span id="zl">100%</span>
    <button id="inn" title="Zoom in (Ctrl +)">+</button>
    <button id="fitb" title="Fit width (Ctrl 0)">Fit</button>
  </div>
  <div id="picker"><button id="pick">Open PDF</button></div>
  <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  <div id="c"><div id="v" class="pdfViewer"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/web/pdf_viewer.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
